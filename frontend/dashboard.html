<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHCET Portal | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <nav class="navbar">
            <div class="nav-brand">ZHCET Portal</div>
            <div class="nav-user">
                <span id="user-greeting">Welcome, User</span>
                <button id="logout-btn" class="secondary-btn">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <div class="dashboard-header" id="dashboard-header">
                <h1 id="dashboard-title">Dashboard</h1>
                <div style="display:flex; gap:1rem; align-items:center;">
                    <input type="text" id="search-input" class="search-bar hidden" placeholder="Search records...">
                    <button id="create-record-btn" class="primary-btn hidden">Add New</button>
                </div>
            </div>

            <!-- Content Area dynamically populated by app.js -->
            <div id="content-area"></div>
        </main>
    </div>

    <!-- Reusable Modal (Hidden by default) -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <h3 id="modal-title">Edit Record</h3>
            <form id="modal-form">
                <div id="modal-fields" style="display: flex; flex-direction: column; gap: 1.5rem;"></div>
                <div class="gap-1 mt-2">
                    <button type="submit" class="primary-btn">Save Content</button>
                    <button type="button" id="modal-close" class="secondary-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
